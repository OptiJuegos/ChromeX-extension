<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChromeX Lite</title><link rel="stylesheet" href="ui.css"></head><body class="options"><main><header><div><span class="eyebrow">MENOS CARGA · MÁS CONTROL</span><h1>ChromeX <em>Lite</em></h1></div><label class="master" title="Activar optimización"><input id="enabled" type="checkbox" aria-label="Activar ChromeX Lite"> ON</label></header><div class="profiles" role="group" aria-label="Perfil"><button data-profile="LITE">LITE</button><button data-profile="PRO">PRO</button><button data-profile="EXTREME">EXTREME</button></div><p id="profileNote" class="note"></p><section><label class="toggle"><span><b>RAM Saver</b><small>Hibernación tras 10 minutos inactiva.</small></span><input type="checkbox" id="ram"></label>
<label class="toggle"><span><b>CSS Performance Engine</b><small>Reduce paint/GPU: blur, sombras y efectos según el perfil.</small></span><input type="checkbox" id="cpu"></label>
<label class="toggle"><span><b>Network Saver</b><small>Bloqueo local de rastreadores conocidos.</small></span><input type="checkbox" id="network"></label>
<label class="toggle"><span><b>Reduce Motion</b><small>Quita transiciones y animaciones CSS.</small></span><input type="checkbox" id="motion"></label>
<label class="toggle"><span><b>Disable Web Fonts</b><small>Bloquea fuentes web; usa fuentes del sistema.</small></span><input type="checkbox" id="fonts"></label>
<label class="toggle"><span><b>Pause Background Video</b><small>Pausa vídeos al ocultar la pestaña.</small></span><input type="checkbox" id="background"></label>
<label class="toggle"><span><b>Site Optimizer</b><small>Perfiles para YouTube (incluye bloqueo del chat), X e Instagram.</small></span><input type="checkbox" id="sites"></label>
<label class="toggle"><span><b>Forzar interfaz móvil</b><small>Mobile Site Mode: pide la versión móvil por User-Agent y JavaScript. Incluido en PRO y EXTREME.</small></span><input type="checkbox" id="mobileUI"></label></section><h2>Ajustes avanzados</h2><section>
<label class="toggle"><span><b>Pausar vídeo fuera de pantalla</b><small>IntersectionObserver; vuelve a reproducirlo manualmente.</small></span><input type="checkbox" id="offscreen"></label>
<label class="toggle"><span><b>Bloquear embeds externos</b><small>Mapas, chatbots, comentarios y reproductores incrustados.</small></span><input type="checkbox" id="widgets"></label>
<label class="toggle"><span><b>Bloquear JavaScript de terceros</b><small>Puede romper inicios de sesión, pagos y aplicaciones.</small></span><input type="checkbox" id="thirdPartyJS"></label>
<label class="toggle"><span><b>Ocultar contenido secundario</b><small>Paneles, tendencias y recomendaciones detectables.</small></span><input type="checkbox" id="secondary"></label>
<label class="toggle"><span><b>Evitar AVIF</b><small>Pide WebP/JPEG cuando el servidor ofrece alternativa. Útil en CPUs antiguas; no bloquea URLs .avif directas.</small></span><input type="checkbox" id="avoidAvif"></label>
<label class="toggle"><span><b>Texto / Lite extremo</b><small>Bloquea multimedia, iframes y fuentes; conserva imágenes con texto alternativo.</small></span><input type="checkbox" id="text"></label>
<label class="toggle"><span><b>Bloquear también TODAS las imágenes</b><small>Solo en Texto / Lite. Incluye imágenes esenciales.</small></span><input type="checkbox" id="allImages"></label></section><p id="status" role="status" aria-live="polite"></p><footer>Hibernación: 10 min · Sin sondeos<br>Recarga las páginas abiertas para aplicar todos los cambios.</footer></main><script type="module" src="ui.js"></script></body></html>
